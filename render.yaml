# Render Blueprint: New → Blueprint → pick this repo. Render reads this file and creates the service.
services:
  - type: web
    name: underworld
    runtime: docker
    # Free plan: no card needed. The service sleeps after 15 min idle (a Telegram message wakes it in ~1 min)
    # and has no persistent disk, so player data resets on every deploy/restart.
    # For real players switch to `plan: starter` and add:
    #   disk: { name: data, mountPath: /data, sizeGB: 1 }
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false # paste your @BotFather token in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/underworld.db
